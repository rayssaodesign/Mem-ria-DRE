<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<title>Memória de Ouro — DRE Contábil</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF0023">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memória DRE">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#FF0023;
    --red-dark:#D8001D;
    --black:#1F1F1F;
    --gray:#9B9B9B;
    --white:#FFFFFF;
    --text-muted:#6B6B6B;

    --q-red-base:#B30019;
    --q-red-lit:#FF0023;
    --q-green-base:#0E7A3B;
    --q-green-lit:#22C55E;
    --q-yellow-base:#B8900A;
    --q-yellow-lit:#FFD400;
    --q-pink-base:#A62A63;
    --q-pink-lit:#FF3D9A;

    --font:'Sora', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--white);}
  body{
    font-family:var(--font);
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  #app{
    position:relative;
    width:100%;
    height:100vh;
    min-height:560px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.045) 0px, rgba(0,0,0,0.045) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.045) 0px, rgba(0,0,0,0.045) 1px, transparent 1px, transparent 42px),
      var(--white);
    overflow:hidden;
  }

  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:28px 22px;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transform:translateY(14px);
    transition:opacity .45s ease, transform .45s ease;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
  }

  .logo-wrap{
    width:clamp(100px, 26vw, 140px);
    margin-bottom:8px;
  }
  .logo-wrap svg{
    width:100%;
    height:auto;
    display:block;
  }

  .eyebrow{
    font-family:var(--font);
    font-weight:600;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--red);
    text-transform:uppercase;
    margin:0;
  }

  .title{
    font-family:var(--font);
    font-weight:800;
    font-size:clamp(30px, 8vw, 46px);
    line-height:1.08;
    margin:0;
    color:var(--black);
    max-width:480px;
  }
  .title .accent{color:var(--red);}

  .subtitle{
    font-family:var(--font);
    font-weight:400;
    font-size:clamp(14px, 3.6vw, 16px);
    line-height:1.5;
    color:var(--text-muted);
    max-width:340px;
    margin:0;
  }

  .result-banner{
    display:flex;
    flex-direction:column;
    gap:3px;
    margin:2px 0 2px;
    max-width:340px;
    animation:fadeIn .4s ease;
  }
  .result-title{
    font-family:var(--font);
    font-weight:700;
    font-size:15px;
    color:var(--red);
    margin:0;
  }
  .result-detail{
    font-family:var(--font);
    font-weight:500;
    font-size:12.5px;
    line-height:1.4;
    color:var(--text-muted);
    margin:0;
    letter-spacing:.01em;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .btn-primary{
    font-family:var(--font);
    font-weight:700;
    font-size:16px;
    color:var(--white);
    background:var(--red);
    border:none;
    padding:15px 44px;
    border-radius:999px;
    cursor:pointer;
    margin-top:8px;
    letter-spacing:.01em;
    box-shadow:0 10px 24px -8px rgba(255,0,35,0.45);
    transition:transform .15s ease, box-shadow .25s ease, background .2s ease;
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px -6px rgba(255,0,35,0.5);
    background:var(--red-dark);
  }
  .btn-primary:active{transform:translateY(0) scale(.97);}
  .btn-primary:focus-visible{outline:3px solid var(--black);outline-offset:3px;}

  .footer-note{
    font-family:var(--font);
    font-weight:500;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--text-muted);
    margin-top:2px;
  }

  /* ---------- GAME SCREEN ---------- */
  .game-header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .round-label{color:var(--red);font-weight:600;}

  .tally{display:flex;gap:7px;}
  .tally-cell{
    width:13px;height:13px;
    border:1.5px solid rgba(31,31,31,0.28);
    border-radius:3px;
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .tally-cell.done{background:var(--red);border-color:var(--red);}
  .tally-cell.current{
    border-color:var(--black);
    box-shadow:0 0 8px rgba(31,31,31,0.35);
  }

  .board-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
  }
  .board{
    position:relative;
    width:min(66vw, 300px);
    height:min(66vw, 300px);
    max-width:300px;
    max-height:300px;
    border-radius:50%;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:6px;
    background:var(--white);
    box-shadow:
      0 0 0 4px var(--black),
      0 20px 50px -14px rgba(0,0,0,0.25);
  }
  .board.shake{animation:shake .5s ease;}
  @keyframes shake{
    10%,90%{transform:translateX(-4px);}
    20%,80%{transform:translateX(6px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }

  .quad{
    border:none;
    cursor:pointer;
    transition:filter .12s ease, transform .12s ease, box-shadow .12s ease, background .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .quad:focus-visible{outline:3px solid var(--black);outline-offset:-8px;}
  .quad.disabled{cursor:default;}
  .quad:not(.disabled):hover{filter:brightness(1.1);}
  .quad:not(.disabled):active{transform:scale(.97);}

  .quad-red{background:var(--q-red-base); border-radius:100% 0 0 0;}
  .quad-green{background:var(--q-green-base); border-radius:0 100% 0 0;}
  .quad-yellow{background:var(--q-yellow-base); border-radius:0 0 0 100%;}
  .quad-pink{background:var(--q-pink-base); border-radius:0 0 100% 0;}

  .quad-red.lit{background:var(--q-red-lit); box-shadow:0 0 32px 8px rgba(255,0,35,0.55);}
  .quad-green.lit{background:var(--q-green-lit); box-shadow:0 0 32px 8px rgba(34,197,94,0.5);}
  .quad-yellow.lit{background:var(--q-yellow-lit); box-shadow:0 0 32px 8px rgba(255,212,0,0.5);}
  .quad-pink.lit{background:var(--q-pink-lit); box-shadow:0 0 32px 8px rgba(255,61,154,0.5);}

  .hub{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:32%;
    aspect-ratio:1;
    background:var(--black);
    border:2.5px solid var(--red);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    font-size:clamp(15px,4vw,19px);
    color:var(--white);
    box-shadow:0 6px 18px rgba(0,0,0,0.22);
    pointer-events:none;
  }

  .status-text{
    font-family:var(--font);
    font-weight:500;
    font-size:13px;
    letter-spacing:.03em;
    color:var(--text-muted);
    min-height:18px;
    margin-top:4px;
    transition:color .2s ease;
  }

  /* Confetti */
  #confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:60;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-24px;
    width:7px;height:13px;
    opacity:0.95;
    animation-name:confetti-fall;
    animation-timing-function:cubic-bezier(.4,0,.6,1);
    animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(112vh) rotate(var(--rot));opacity:0.85;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }

  @media (max-height: 620px){
    .screen{gap:8px;padding:16px;}
    .title{font-size:clamp(24px,7vw,34px);}
    .board{width:min(52vw,220px);height:min(52vw,220px);}
  }
</style>
</head>

<script>
(function(){
  const TOTAL_ROUNDS = 6;
  const COLORS = [0,1,2,3];
  const freqMap = {0:392.00, 1:329.63, 2:261.63, 3:196.00};

  let sequence = [];
  let round = 0;
  let playerStep = 0;
  let acceptingInput = false;
  let audioCtx = null;

  const boardEl = document.getElementById('board');
  const quads = Array.from(document.querySelectorAll('.quad'));
  const statusEl = document.getElementById('status-text');
  const roundCurrentEl = document.getElementById('round-current');
  const hubNumberEl = document.getElementById('hub-number');
  const tallyEl = document.getElementById('tally');
  const confettiLayer = document.getElementById('confetti-layer');
  const resultBanner = document.getElementById('result-banner');
  const resultTitleEl = document.getElementById('result-title');
  const resultDetailEl = document.getElementById('result-detail');

  for (let i = 0; i < TOTAL_ROUNDS; i++) {
    const c = document.createElement('span');
    c.className = 'tally-cell';
    tallyEl.appendChild(c);
  }
  const tallyCells = Array.from(document.querySelectorAll('.tally-cell'));

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function statusText(msg){ statusEl.textContent = msg; }

  function ensureAudio(){
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, dur, type, delay, vol){
    if (!audioCtx) return;
    type = type || 'sine';
    delay = delay || 0;
    vol = vol === undefined ? 0.22 : vol;
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function playFail(){
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, t0);
    osc.frequency.exponentialRampToValueAtTime(70, t0 + 0.5);
    gain.gain.setValueAtTime(0.22, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.6);
  }

  function playRoundSuccess(){
    playTone(523.25, 0.12, 'sine', 0, 0.18);
    playTone(659.25, 0.18, 'sine', 0.1, 0.18);
  }

  function playVictory(){
    const notes = [523.25, 659.25, 784.00, 1046.50];
    notes.forEach((f, i) => playTone(f, 0.32, 'triangle', i * 0.15, 0.2));
  }

  function updateTally(){
    tallyCells.forEach((c, i) => {
      c.classList.remove('done', 'current');
      if (i < round - 1) c.classList.add('done');
      else if (i === round - 1) c.classList.add('current');
    });
  }

  function setBoardDisabled(disabled){
    quads.forEach(q => q.classList.toggle('disabled', disabled));
  }

  function litQuad(idx, duration){
    const el = document.querySelector('.quad[data-color="' + idx + '"]');
    el.classList.add('lit');
    setTimeout(() => el.classList.remove('lit'), duration);
  }

  function startGame(){
    sequence = [];
    round = 0;
    resultBanner.hidden = true;
    updateTally();
    showScreen('screen-game');
    setTimeout(nextRound, 400);
  }

  function nextRound(){
    round++;
    playerStep = 0;
    roundCurrentEl.textContent = String(round).padStart(2, '0');
    hubNumberEl.textContent = String(round).padStart(2, '0');
    updateTally();
    sequence.push(COLORS[Math.floor(Math.random() * 4)]);
    statusText('Observe a sequência...');
    acceptingInput = false;
    setBoardDisabled(true);
    setTimeout(playSequence, 550);
  }

  function playSequence(){
    const stepDuration = Math.max(320, 650 - (round - 1) * 40);
    const gap = Math.max(160, 300 - (round - 1) * 20);
    sequence.forEach((colorIdx, i) => {
      setTimeout(() => {
        litQuad(colorIdx, stepDuration * 0.8);
        playTone(freqMap[colorIdx], (stepDuration / 1000) * 0.8, 'sine');
      }, i * (stepDuration + gap));
    });
    const totalTime = sequence.length * (stepDuration + gap);
    setTimeout(() => {
      acceptingInput = true;
      setBoardDisabled(false);
      statusText('Sua vez! Repita a sequência.');
    }, totalTime + 250);
  }

  function checkAnswer(idx){
    if (sequence[playerStep] === idx) {
      playerStep++;
      if (playerStep === sequence.length) {
        acceptingInput = false;
        setBoardDisabled(true);
        playRoundSuccess();
        statusText('Rodada fechada! ✔');
        if (round === TOTAL_ROUNDS) {
          setTimeout(() => endGame(true), 900);
        } else {
          setTimeout(nextRound, 1000);
        }
      }
    } else {
      acceptingInput = false;
      setBoardDisabled(true);
      playFail();
      statusText('A conta não fechou...');
      boardEl.classList.add('shake');
      setTimeout(() => {
        boardEl.classList.remove('shake');
        endGame(false);
      }, 650);
    }
  }

  function endGame(won){
    if (won) {
      resultTitleEl.textContent = 'Memória auditada e aprovada.';
      resultDetailEl.textContent = 'Você fechou as 6 rodadas sem erro. Isso é balanço perfeito.';
    } else {
      resultTitleEl.textContent = 'A conta não fechou.';
      resultDetailEl.textContent = 'Você chegou até a rodada ' + round + ' de ' + TOTAL_ROUNDS + '. Toda auditoria tem direito a uma segunda tentativa.';
    }
    resultBanner.hidden = false;
    showScreen('screen-start');
    if (won) {
      playVictory();
      launchConfetti();
    }
  }

  function launchConfetti(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#FF0023', '#22C55E', '#FFD400', '#FF3D9A'];
    for (let i = 0; i < 46; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random() * 100) + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2.4 + Math.random() * 1.6) + 's';
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      piece.style.setProperty('--rot', (Math.random() * 360) + 'deg');
      confettiLayer.appendChild(piece);
      setTimeout(() => piece.remove(), 4600);
    }
  }

  quads.forEach(q => {
    q.addEventListener('click', () => {
      if (!acceptingInput || q.classList.contains('disabled')) return;
      const idx = parseInt(q.dataset.color, 10);
      litQuad(idx, 180);
      playTone(freqMap[idx], 0.22, 'sine');
      checkAnswer(idx);
    });
  });

  document.getElementById('btn-play').addEventListener('click', () => {
    ensureAudio();
    startGame();
  });

})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
